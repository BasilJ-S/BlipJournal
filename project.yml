name: BlipJournal
options:
  bundleIdPrefix: io.github.basilj-s
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # The paid Apple Developer Program team. A team picked in Xcode is lost on every
    # `xcodegen generate`, and the free Personal Team cannot upload to the App Store.
    DEVELOPMENT_TEAM: LN4L44GD8T
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BlipJournalCore:
    path: BlipJournalCore
targets:
  BlipJournal:
    type: application
    platform: iOS
    sources:
      # Markdown is documentation, not a bundle resource. Every component folder has a
      # DESIGN.md, and three files of that name collide in the app bundle: without this
      # the build fails with "Multiple commands produce .../BlipJournal.app/DESIGN.md".
      - path: BlipJournal
        excludes:
          - "**/*.md"
    dependencies:
      - package: BlipJournalCore
        product: BlipJournalCore
    info:
      path: BlipJournal/Info.plist
      properties:
        CFBundleDisplayName: Blip Journal
        # Read from the build settings above so each upload only bumps CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        NSFaceIDUsageDescription: Blip Journal uses Face ID to keep your journal private.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Nunito.ttf, JetBrainsMono.ttf]
        # Survey files (docs/survey-format.md): Blip Journal owns .blipsurvey and is
        # offered for any .json. Files are read in place inside their security scope.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Blip Journal survey
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.basilj-s.BlipJournal.survey]
          - CFBundleTypeName: JSON survey file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.basilj-s.BlipJournal.survey
            UTTypeDescription: Blip Journal survey
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [blipsurvey]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basilj-s.BlipJournal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # iPhone only for v0. Set here, not in the project-level settings: XcodeGen's
        # iOS target preset sets "1,2", which overrides the project level, so the app
        # shipped as universal and App Store validation demanded iPad orientations.
        TARGETED_DEVICE_FAMILY: "1"
  BlipJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlipJournalTests
    dependencies:
      - target: BlipJournal
      - package: BlipJournalCore
        product: BlipJournalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basilj-s.BlipJournalTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BlipJournal:
    build:
      targets:
        BlipJournal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlipJournalTests
