name: OpenBlip
options:
  bundleIdPrefix: io.github.basilj-s
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only for v0
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  OpenBlipCore:
    path: OpenBlipCore
targets:
  OpenBlip:
    type: application
    platform: iOS
    sources:
      # Markdown is documentation, not a bundle resource. Every component folder has a
      # DESIGN.md, and three files of that name collide in the app bundle: without this
      # the build fails with "Multiple commands produce .../OpenBlip.app/DESIGN.md".
      - path: OpenBlip
        excludes:
          - "**/*.md"
    dependencies:
      - package: OpenBlipCore
        product: OpenBlipCore
    info:
      path: OpenBlip/Info.plist
      properties:
        CFBundleDisplayName: Blip Journal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        NSFaceIDUsageDescription: Blip Journal uses Face ID to keep your journal private.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: OpenBlip/OpenBlip.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basilj-s.OpenBlip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  OpenBlipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenBlipTests
    dependencies:
      - target: OpenBlip
      - package: OpenBlipCore
        product: OpenBlipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basilj-s.OpenBlipTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenBlip:
    build:
      targets:
        OpenBlip: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenBlipTests
