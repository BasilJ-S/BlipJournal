name: BlipJournal
options:
  bundleIdPrefix: io.github.basilj-s
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only for v0
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
# In the project for editing in Xcode, but in no target, so nothing builds or bundles it.
fileGroups:
  - BlipJournal/Settings/TipJar.storekit
packages:
  BlipJournalCore:
    path: BlipJournalCore
targets:
  BlipJournal:
    type: application
    platform: iOS
    sources:
      # Markdown is documentation, not a bundle resource. Every component folder has a
      # DESIGN.md, and three files of that name collide in the app bundle: without this
      # the build fails with "Multiple commands produce .../BlipJournal.app/DESIGN.md".
      - path: BlipJournal
        excludes:
          - "**/*.md"
          # Local StoreKit testing only (see fileGroups); it must never ship in the bundle.
          - "**/*.storekit"
    dependencies:
      - package: BlipJournalCore
        product: BlipJournalCore
    info:
      path: BlipJournal/Info.plist
      properties:
        CFBundleDisplayName: Blip Journal
        # Read from the build settings above so each upload only bumps CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        NSFaceIDUsageDescription: Blip Journal uses Face ID to keep your journal private.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Nunito.ttf, JetBrainsMono.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basilj-s.BlipJournal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  BlipJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlipJournalTests
    dependencies:
      - target: BlipJournal
      - package: BlipJournalCore
        product: BlipJournalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basilj-s.BlipJournalTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BlipJournal:
    build:
      targets:
        BlipJournal: all
    run:
      config: Debug
      # Simulated tip products for Run from Xcode. Archives and TestFlight use the App Store.
      storeKitConfiguration: BlipJournal/Settings/TipJar.storekit
    test:
      config: Debug
      targets:
        - BlipJournalTests
